name: Generate and test WeatherAPI SDK

on:
  push:
    paths:
      - .github/workflows/generate-sdk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch upstream OpenAPI specification
        run: |
          curl --fail --location --show-error --retry 2 https://www.weatherapi.com/openapi.json -o openapi.json
          node -e 'const x=require("./openapi.json");if(!x.openapi||!x.paths)process.exit(1);console.log(x.openapi,Object.keys(x.paths).length)'
      - name: Scaffold using Voxgig create-sdkgen
        run: |
          npm create --yes @voxgig/sdkgen@latest -- weatherapi -d "$GITHUB_WORKSPACE/openapi.json" -o "$GITHUB_WORKSPACE/generated/weatherapi" -t ts -f test
      - name: Generate TypeScript SDK
        working-directory: generated/weatherapi/.sdk
        run: npm run generate
      - name: Build and run generated offline tests
        working-directory: generated/weatherapi/ts
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
      - name: Commit verified generated SDK
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/weatherapi
          if ! git diff --cached --quiet; then
            git commit -m "Generate WeatherAPI TypeScript SDK with Voxgig"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weatherapi-sdk-output
          path: generated/weatherapi/
          if-no-files-found: warn
          retention-days: 7
